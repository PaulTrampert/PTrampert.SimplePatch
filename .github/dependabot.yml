# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directories:
    - / # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      csharp-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "(PATCH)"
      include: "scope"
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi [2.12.2, 3.0.0), so a 3.x
      # bump breaks restore (NU1107) and, through the shared group, the whole update. Remove this
      # once Microsoft.AspNetCore.OpenApi supports 3.x. See #169.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "(PATCH)"
      include: "scope"
