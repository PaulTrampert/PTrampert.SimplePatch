name: Benchmarks

# Separate from the main build pipeline so a slow or noisy benchmark run never holds up
# building, testing or publishing. The results are informational, not a pass/fail gate.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

# A new push supersedes the run for the previous one.
concurrency:
  group: benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run benchmarks
        run: >
          dotnet run -c Release --project PTrampert.SimplePatch.Benchmarks --
          --filter '*' --artifacts BenchmarkDotNet.Artifacts

      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/

      # Keeps one comment per PR, found by its header and updated on each push. The GITHUB_TOKEN of a
      # pull request from a fork can't comment, so those PRs get the artifact only.
      - uses: marocchino/sticky-pull-request-comment@v3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          header: benchmarks
          path: BenchmarkDotNet.Artifacts/results/*-report-github.md
          message: |
            ## Patch class generation benchmarks

            Results for ${{ github.event.pull_request.head.sha }}. The table run with `RunStrategy=ColdStart`
            times the first patch class in a fresh process; the one with a `SourceType` column times
            generation once everything is loaded. Times on shared CI runners vary from run to run, so
            compare the ratios more than the absolute numbers.

            {{{content}}}
